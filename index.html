<script>

// بداية الأسبوع الثاني: الأحد 22 نوفمبر 2026 (الأسبوع يبدأ الأحد وينتهي السبت)
const WEEK_TWO_START=Date.UTC(2026,10,22);
const MS_PER_WEEK=7*24*60*60*1000;

function getSundayUtc(date=new Date()){
  return Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()-date.getDay());
}

function getCurrentWeek(date=new Date()){
  const currentSundayUtc=getSundayUtc(date);
  const weekOffset=Math.round((currentSundayUtc-WEEK_TWO_START)/MS_PER_WEEK);
  return Math.abs(weekOffset%2)===0?2:1;
}

const N={
  P:"Applied Physics",

function syncAutoWeek(date=new Date()){
  const detectedWeek=getCurrentWeek(date);
  const weekChanged=detectedWeek!==autoWeek;
  autoWeek=detectedWeek;
  if(weekChanged){
    manualWeekOverride=false;
    week=autoWeek;
  }else if(!manualWeekOverride){

  }
  return weekChanged;
}

  }));

};

function pad2(value){
  return String(value).padStart(2,"0");
}

function formatIcsDate(date){
  return date.getUTCFullYear()+pad2(date.getUTCMonth()+1)+pad2(date.getUTCDate());
}

function formatIcsTime(hour,minute=0){
  return pad2(hour)+pad2(minute)+"00";
}

function escapeIcsText(value){
  return String(value)
    .replace(/\\/g,"\\\\")
    .replace(/\r?\n/g,"\\n")
    .replace(/;/g,"\\;")
    .replace(/,/g,"\\,");
}

function foldIcsLine(line){
  const encoder=new TextEncoder();
  let folded="";
  let bytes=0;
  for(const character of line){
    const characterBytes=encoder.encode(character).length;
    if(bytes+characterBytes>75){
      folded+="\r\n ";
      bytes=1;
    }
    folded+=character;
    bytes+=characterBytes;
  }
  return folded;
}

function getIcsStartDate(dayIndex,weekType){
  const weekBase=new Date(WEEK_TWO_START);
  if(weekType===1)weekBase.setUTCDate(weekBase.getUTCDate()+7);
  weekBase.setUTCDate(weekBase.getUTCDate()+dayIndex);
  return weekBase;
}

function createIcsCalendar(){
  const lines=[
    "BEGIN:VCALENDAR",
    "PRODID:-//Y1 Schedule//Arabic Calendar//AR",
    "VERSION:2.0",
    "CALSCALE:GREGORIAN",
    "METHOD:PUBLISH",
    "X-WR-CALNAME:جدول سكشن "+sec
  ];
  const stamp=new Date();
  const dtstamp=stamp.toISOString().replace(/[-:]/g,"").replace(/\.\d{3}Z$/,"Z");

  const lectures=LEC_ALL.filter(item=>item[6].includes(sec)).map(item=>({
    day:item[0],
    start:item[1],
    end:item[2],
    subject:N[item[3]],
    instructor:item[4],
    room:item[5],
    weekType:0,
    kind:"محاضرة"
  }));
  const sections=S_ALL.filter(item=>item[7].includes(sec)).map(item=>({
    day:item[0],
    start:item[1],
    end:item[2],
    subject:N[item[3]],
    instructor:"م. "+item[4],
    room:item[5],
    weekType:item[6],
    kind:"سكشن"
  }));

  lectures.concat(sections).forEach((item,index)=>{
    const startDate=getIcsStartDate(item.day,item.weekType);
    const datePart=formatIcsDate(startDate);
    const uid=`y1-sec${sec}-${index}-${item.day}-${item.start}-${item.end}@schedule.local`;
    const repeat=item.weekType===0
      ?"RRULE:FREQ=WEEKLY;INTERVAL=1"
      :"RRULE:FREQ=WEEKLY;INTERVAL=2";

    lines.push("BEGIN:VEVENT");
    lines.push("UID:"+uid);
    lines.push("DTSTAMP:"+dtstamp);
    lines.push("DTSTART:"+datePart+"T"+formatIcsTime(item.start));
    lines.push("DTEND:"+datePart+"T"+formatIcsTime(item.end));
    lines.push(repeat);
    lines.push("SUMMARY:"+escapeIcsText(item.subject+" - "+item.kind+" "+sec));
    lines.push("LOCATION:"+escapeIcsText(item.room));
    lines.push("DESCRIPTION:"+escapeIcsText("الدكتور: "+item.instructor+"\\nالسكشن: "+sec+"\\nالنوع: "+item.kind+(item.weekType===1?"\\nالأسبوع: 1":item.weekType===2?"\\nالأسبوع: 2":"")));
    lines.push("BEGIN:VALARM");
    lines.push("TRIGGER:-PT15M");
    lines.push("ACTION:DISPLAY");
    lines.push("DESCRIPTION:"+escapeIcsText("تذكير قبل الحصة بـ 15 دقيقة"));
    lines.push("END:VALARM");
    lines.push("END:VEVENT");
  });

  lines.push("END:VCALENDAR");
  return lines.map(foldIcsLine).join("\r\n")+"\r\n";
}

function downloadSectionCalendar(){
  const calendar=createIcsCalendar();
  const blob=new Blob(["\ufeff"+calendar],{type:"text/calendar;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const link=document.createElement("a");
  link.href=url;
  link.download=`section-${sec}-schedule.ics`;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

  const banner=nextBanner();

  daySelect.value=String(sel);
  [...daySelect.options].forEach((option,k)=>{
    const n=dayItems(k,sec).filter(c=>week===0||c.w===0||c.w===week).length;
    const status=OFF.includes(k)?"إجازة":n?`${n} ${n===1?"حصة":"حصص"}`:"فاضي";
    option.textContent=`${DN[k]} — ${status}`;
  });

  const rawItems=dayItems(sel,sec);
  const items=rawItems
    .filter(c=>filter==="all"||(filter==="lec")===(c.ty==="lec"))
    .filter(c=>week===0||c.w===0||c.w===week);

  if(!items.length){
    list.innerHTML=`<div class="empty"><span class="e">${icon(OFF.includes(sel)?"rest":"party")}</span><h3>${OFF.includes(sel)?"يوم إجازة، استمتع بوقتك":"لا توجد حصص مجدولة لهذا اليوم"}</h3></div>`;
    return;
  }

  items.forEach((c,k)=>{
    const live=sel===todayIdx&&nowMin>=c.s*60&&nowMin<c.e*60;
    const col=CARD_COLORS[k%CARD_COLORS.length];
    const el=document.createElement("div");
    el.className="card"+(live?" now":"");
    el.style.setProperty("--c",col);
    el.style.animationDelay=k*70+"ms";

    const typeLbl=c.ty==="lec"?"محاضرة":`سكشن · ${c.tag}`;
    const wkBadge=c.w===1?'<span class="wk hi">أسبوع 1</span>':c.w===2?'<span class="wk hi">أسبوع 2</span>':'<span class="wk">كل أسبوع</span>';

    el.innerHTML=`<div class="time">${fmt(c.s)}<small>→ ${fmt(c.e)}</small></div>
    <div class="info"><h3>${c.t}${live?'<span class="live">الآن</span>':""}</h3>
    <div class="meta">
      <span class="tag">${typeLbl}</span>
      ${c.ty==="sec"?wkBadge:""}
      <span class="icon-label">${icon("user")} ${c.ta}</span>
      <span class="icon-label">${icon("pin")} ${c.r}</span>
    </div></div>`;
    list.appendChild(el);
  });
}

function createSvgIconDataUrl(size){
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 64 64"><defs><linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#071226"/><stop offset="100%" stop-color="#0e2244"/></linearGradient><linearGradient id="cyberGlow" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#1976ff"/></linearGradient></defs><rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#22d3ee" stroke-width="2"/><path d="M32 9 50 17v13c0 11.5-7.6 21.2-18 25-10.4-3.8-18-13.5-18-25V17L32 9Z" fill="#0b1b36" stroke="url(#cyberGlow)" stroke-width="2.4" stroke-linejoin="round"/><circle cx="32" cy="9" r="2.3" fill="#2dd4bf"/><circle cx="14" cy="17" r="2.1" fill="#38bdf8"/><circle cx="50" cy="17" r="2.1" fill="#38bdf8"/><path d="M21 26h5m12 0h5M21 38h5m12 0h5" stroke="#2dd4bf" stroke-width="1.8" stroke-linecap="round"/><text x="32" y="36" text-anchor="middle" fill="#eff4ff" font-family="Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="1">MB</text></svg>`;
  return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
}

function setupFallbackManifest(){
  const manifestLink=$("pwa-manifest");
  if(!manifestLink||location.protocol==="file:")return;
  const manifestData={
    name:"Mohamed BonDok - جدول السنة الأولى",
    short_name:"Mohamed BonDok",
    start_url:location.pathname||"/",
    scope:"./",
    display:"standalone",
    background_color:"#090d19",
    theme_color:"#090d19",
    lang:"ar",
    dir:"rtl",
    icons:[
      {src:createSvgIconDataUrl(192),sizes:"192x192",type:"image/svg+xml",purpose:"any"},
      {src:createSvgIconDataUrl(512),sizes:"512x512",type:"image/svg+xml",purpose:"any"}
    ]
  };
  fetch("./manifest.webmanifest",{cache:"no-store"}).then(res=>{
    if(!res.ok)throw new Error("manifest not found");
    return res.json();
  }).then(manifest=>{
    const hasIcons=Array.isArray(manifest.icons)&&manifest.icons.length>0;
    if(!hasIcons){
      throw new Error("manifest missing icons");
    }
  }).catch(()=>{
    const blob=new Blob([JSON.stringify(manifestData)],{type:"application/manifest+json"});
    manifestLink.href=URL.createObjectURL(blob);
  });
}

setupFallbackManifest();

window.addEventListener("beforeinstallprompt",e=>{
  e.preventDefault();
  deferredInstallPrompt=e;
  if(installBtn)installBtn.hidden=false;
});

if(installBtn){
  installBtn.onclick=async()=>{
    if(!deferredInstallPrompt)return;
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt=null;
    installBtn.hidden=true;
  };
}

window.addEventListener("appinstalled",()=>{
  deferredInstallPrompt=null;
  if(installBtn)installBtn.hidden=true;
});

// تحديد اليوم والأسبوع تلقائياً
syncAutoWeek(now);
selectNextScheduledDay();

render();

function updateClock(){
  const previousDay=todayIdx;
  const previousHour=Math.floor(nowMin/60);
  now=new Date();
  const weekChanged=syncAutoWeek(now);
  todayIdx=JD.indexOf(now.getDay());
  nowMin=now.getHours()*60+now.getMinutes();

  if(todayIdx!==previousDay&&sel===previousDay)selectNextScheduledDay();
  if(view==="s"&&(todayIdx!==previousDay||Math.floor(nowMin/60)!==previousHour||weekChanged))render();
}

setInterval(updateClock,30000);
document.addEventListener("visibilitychange",()=>{
  if(!document.hidden)updateClock();
});

if("serviceWorker" in navigator&&location.protocol!=="file:"){
  window.addEventListener("load",()=>{
    const swCode=`
      const CACHE_NAME="schedule-y1-v2";
      self.addEventListener("install",event=>{
        self.skipWaiting();
      });
      self.addEventListener("activate",event=>{
        event.waitUntil(
          caches.keys().then(keys=>Promise.all(
            keys.filter(k=>k!==CACHE_NAME).map(k=>caches.delete(k))
          ))
        );
        self.clients.claim();
      });
      self.addEventListener("fetch",event=>{
        if(event.request.method!=="GET")return;
        event.respondWith(
          fetch(event.request).then(res=>{
            const clone=res.clone();
            caches.open(CACHE_NAME).then(c=>c.put(event.request,clone)).catch(()=>{});
            return res;
          }).catch(()=>caches.match(event.request))
        );
      });
    `;
    const swBlob=new Blob([swCode],{type:"application/javascript"});
    const swUrl=URL.createObjectURL(swBlob);
    navigator.serviceWorker.register(swUrl).catch(error=>{
      console.error("Service worker registration failed:",error);
    });
  });
}
